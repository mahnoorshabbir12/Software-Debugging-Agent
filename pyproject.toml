[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-debugger"
version = "0.1.0"
description = "Autonomous Software Debugging Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pathspec>=0.11.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-language-pack>=0.2.0",
    "sentence-transformers>=2.0.0",
    "qdrant-client>=1.7.0",
    "fastembed>=0.2.7",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.10",
    "langchain-ollama>=0.2.0",
    "langgraph>=0.1.0",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
    "duckduckgo-search>=5.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "docker>=7.0.0",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sse-starlette>=2.0.0",
    "structlog>=24.1.0",
    # AI dependencies to be added in later phases
    # "langchain>=0.1.0",
    # "langgraph>=0.0.26",
    # "qdrant-client>=1.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0"
]

[project.scripts]
debugger = "apps.api.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "backend*", "ingestion*", "sandbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
